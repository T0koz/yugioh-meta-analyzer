# Situations de l'échantillon J1 (TOK-143, jalon n°6) — écrites par la session de l'oracle, le 2026-11-18, AVANT de les jouer.
#
# But : exercer **chaque clause** des 20 effets tirés (echantillon-j1.md § 1, graine 20260118) : condition remplie et non
# remplie, choix possibles, coût, limite par tour. Écrites à partir du **texte TCG** de chaque carte (table `cards` de la
# base de référence, lue en lecture seule), sans lire le code du moteur ni sa formalisation (isolement AGPL, décision 0055).
# Ce fichier est figé par un commit avant toute exécution dans l'oracle (empreinte dans le message du commit) ; les
# réponses de l'oracle sont dans reponses-oracle.md § 9. Le jalon n°7 exécutera le moteur sur ces situations et comptera
# les accords avec l'oracle (unité : l'effet ; un effet est juste si toutes ses situations sont en accord).
#
# Même schéma que situations-j1.yaml et tests-branded.yaml (conventions de départ identiques : tour 1, nous commençons,
# Phase Principale 1, pas de pioche, terrain adverse vide, Extra Deck complet, Deck = les 40 cartes du deck source moins
# celles placées ailleurs, mémoire du tour vide). Champs ajoutés :
#   clause   : la clause du texte que la situation exerce.
#   observer : ce qu'il faut relever chez l'oracle comme chez le moteur (liste proposée, choix, état d'arrivée).
#   attendu  : lecture de la session de l'oracle à partir du texte TCG, écrite AVANT de jouer. Ce n'est pas la référence :
#              la référence est la réponse de l'oracle (§ 9 de reponses-oracle.md).
# « (Invocation Fusion ce tour) », « (Invocation Synchro ce tour) » : le monstre a été correctement invoqué ce tour depuis
# l'Extra Deck (mémoire du tour). « posé » : placé sans historique d'invocation. Les numéros d'effet suivent
# echantillon-j1.md (rang dans le texte TCG).

# Clauses non exerçables avec ce deck au tour 1 (déclarées, sans situation) : limite par tour de GARURA/2, MERC/2,
# TITAN/3 et CHAMPIONS/1 (un seul exemplaire, qui ne peut pas revenir la déclencher une 2e fois) ; GSWORD/2 : bannissement
# face cachée (aucune carte du deck ne bannit face cachée) et limite par tour (GSWORD se bannit en coût) ; AEON/1 : « 3
# matériels ou plus » (il faudrait 3 Fusions d'Attributs tous différents) et l'Extra Deck adverse ; DECCLESIA/2 et
# BOPENING/2 en Damage Step (pas de combat). 86 situations, 20 effets.

