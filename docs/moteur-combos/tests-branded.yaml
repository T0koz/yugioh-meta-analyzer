      memoire: ["effet d'ALUBER activé ce tour (1er exemplaire)", "verrou BOPENING : Extra Deck = Fusion seulement"]
    action: "Activer l'effet de recherche du 2e ALUBER (il vient d'être Invoqué Spécialement)."
    attendu: {verdict: illegal, raison: "« You can only use 1 \"Aluber the Jester of Despia\" effect per turn, and only once that turn » : limite par nom, valable pour toutes les copies."}
    source: "Texte d'ALUBER (dernière phrase)."
    regles: []
    confiance: haute

