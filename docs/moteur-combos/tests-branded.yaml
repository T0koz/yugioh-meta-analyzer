    mecanique: activation_sans_resolution_possible
    perimetre: pilote
    depart: {main: [ALBAZ, ASH, ASH, OGRE, DROLL]}
    action: "Invocation Normale d'ALBAZ, puis activer son effet (défausser 1 carte ; Invocation Fusion avec des monstres des deux terrains)."
    attendu: {verdict: illegal, raison: "ALBAZ ne peut pas utiliser d'autres monstres que vous contrôlez et l'adversaire n'en contrôle aucun : aucune Fusion (2 matériels au moins) n'est possible. L'invocation est légale, pas l'activation."}
