# Jeu de tests Branded, écrit à la main (TOK-87) — version 2 du 2026-11-16
# v2 : les 4 cartes sans texte ont été chargées en base (D8) ; 14 situations corrigées.
#
# TOUTES les situations sont « à valider par un juge humain (TOK-89) » : leur auteur n'est pas un
# juge et Thomas ne joue pas. Aucun script de simulateur n'a été consulté.
# Mode d'emploi, deck source, conventions : jeu-de-tests-branded.md
# Points de règle (R01…) : points-de-regle-a-valider.md
#
# Conventions
#   depart      : seules les zones non vides sont écrites. Par défaut : tour 1, nous commençons,
#                 Phase Principale 1, pas de pioche, terrain adverse vide, Extra Deck complet,
#                 deck = les 40 cartes moins celles placées ailleurs, mémoire du tour vide.
#   memoire     : faits du tour déjà acquis (voir « mémoire du tour », definitions-et-schema.md § 2.1).
#   attendu.verdict : legal | illegal | non_couvert
#   choix       : liste EXACTE attendue des options légales. exclus : pièges qui ne doivent pas y être.
#   incomplet   : cartes non couvertes qui rendent la liste « peut-être incomplète » (§ 3.4, cas 3).
#   confiance   : haute | moyenne | basse — celle de l'auteur, PAS une validation.
#   perimetre   : pilote | hors_pilote (réservé : adversaire, tours suivants).

version: 2
deck_source: 6af240d29e8b7a3a8eb28d8d
validation_par_defaut: "à valider par un juge humain (TOK-89)"

