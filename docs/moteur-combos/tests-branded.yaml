situations:

  # ── A. Règles de base du tour ────────────────────────────────────────────────────────────
  - id: T01
    mecanique: invocation_normale_et_declencheur
    perimetre: pilote
    depart: {main: [ALUBER, ASH, ASH, OGRE, DROLL]}
    action: "Invocation Normale d'ALUBER, puis activer son effet déclenché (chercher une Magie/Piège « Branded » dans le Deck)."
    attendu:
      verdict: legal
      choix: [BFUSION, BOPENING, BHIGH, TFTV]
      etat: "la carte choisie est en main ; Invocation Normale consommée ; « une fois par tour » d'ALUBER consommé ; deck mélangé."
      note: "L'effet est facultatif (« You can ») : ne pas l'activer est aussi légal."
    source: "Textes d'ALUBER (1er effet) et de TFTV (« always treated as a Branded card »)."
    regles: [R02, R11]
    confiance: haute

  - id: T02
    mecanique: activation_sans_resolution_possible
    perimetre: pilote
    depart:
      main: [BFUSION, BOPENING, BHIGH]
      terrain: ["ALUBER (vient d'être Invoqué Normalement)"]
      cimetiere: [TFTV, TFTV, TFTV]
      memoire: ["Invocation Normale utilisée"]
    action: "Activer l'effet de recherche d'ALUBER."
    attendu:
      verdict: illegal
      raison: "Aucune Magie/Piège « Branded » ne reste dans le Deck : BFUSION, BOPENING et BHIGH sont en main, les 3 TFTV (traitées comme « Branded ») au Cimetière."
    source: "Textes d'ALUBER et de TFTV ; règle générale d'activation."
    regles: [R01]
    confiance: moyenne
  - id: T03
    mecanique: invocation_normale_unique
    perimetre: pilote
    depart: {main: [ALBAZ, ASH, OGRE, DROLL], terrain: [ALUBER], memoire: ["Invocation Normale utilisée (ALUBER)"]}
    action: "Invocation Normale d'ALBAZ."
    attendu: {verdict: illegal, raison: "Une seule Invocation Normale ou Pose par tour."}
    source: "Livret de règles (Invocation Normale)."
    regles: []
    confiance: haute

  - id: T04
    mecanique: une_fois_par_tour_par_nom
    perimetre: pilote
    depart:
      main: [ASH, OGRE, DROLL]
      terrain: [ALUBER, "ALUBER (2e exemplaire, invoqué en Défense par BOPENING)"]
